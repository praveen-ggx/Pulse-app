[build]
  # scripts/build-ci.js runs expo export + both subproject builds concurrently,
  # then copies their output into dist/ (expo export wipes dist/, so the copy
  # must come after it). See the script header for the ordering constraint.
  command = "npm run build:ci"
  publish = "dist"

[build.environment]
  NODE_VERSION  = "20"
  # Use cached packages before hitting the registry
  NPM_FLAGS     = "--prefer-offline --legacy-peer-deps"
  # Expo export is memory-hungry; give it headroom
  NODE_OPTIONS  = "--max-old-space-size=4096"
  CI            = "true"
  # Enable Metro's persistent FileStore (metro.config.js gates on this).
  # Without it every deploy pays the full ~58s cold-transform cost; warm is ~18s.
  # Preferred over NODE_ENV=production, which would also make npm skip
  # devDependencies and break the Expo build.
  METRO_PERSISTENT_CACHE = "1"
  # Brotli q9: 0.9s vs 20.3s at q11, for +10.7% size on immutable chunks.
  BROTLI_QUALITY = "9"
  # Public site origin is intentionally baked into HTML/share links — not a secret.
  # Supabase anon key is public-by-design (RLS enforces access, not secrecy) and
  # the project URL is hardcoded in migrations for pg_cron/pg_net edge function calls.
  # VITE_* carry the SAME public project URL + anon key as their EXPO_PUBLIC_*
  # counterparts (analytics/ and oms/ are Vite apps, the root app is Expo), so
  # they need the same exemption — otherwise the scanner flags the values this
  # very file defines, plus the URL hardcoded in pg_cron migrations.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_WEB_BASE_URL,EXPO_PUBLIC_SUPABASE_URL,EXPO_PUBLIC_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"
  VITE_SUPABASE_URL      = "https://nafxpivddesgsrthmosv.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hZnhwaXZkZGVzZ3NydGhtb3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2OTg3NTYsImV4cCI6MjA4NjI3NDc1Nn0.nXCf5LrTXtg9NNi850MKTCcG_FEE7Tb4qbpP7ftoVBY"
  # VITE_ADMIN_TOKEN and VITE_SUPABASE_SERVICE_ROLE_KEY must be set in
  # Netlify Dashboard → Site settings → Environment variables (never commit secrets)

# Dependency install: Netlify caches npm from package-lock.json (no custom plugin).
# Keep NODE_VERSION + .nvmrc aligned so cache keys stay stable.

[functions]
  directory = "netlify/functions"

# OMS SPA routes — must come before the /* catch-all
# Covers both /oms/* (post-base change) and current /dashboard, /orders etc (pre-base)
[[redirects]]
  from   = "/oms/*"
  to     = "/oms/index.html"
  status = 200

[[redirects]]
