# Ops / Admin console SPA routes — must come before the /* catch-all.
# Two entry points, one app (dist/ops-9f3a2c, built by npm run build:admin):
#   /admin/*       — canonical path, matches the dev URL (localhost:8081/admin/)
#   /ops-9f3a2c/*  — original path, kept so existing bookmarks keep working
# Both are 200 rewrites (URL stays put), not 302s, so the SPA owns its routing
# and deep links / refreshes on /admin/support etc. resolve instead of 404ing.
# NOTE: /admin is a convenience path, NOT a security boundary — access control is
# AdminAuthProvider + platform_users/get_my_platform_permissions RLS. Assets under
# /ops-9f3a2c/assets/* are real files, so Netlify serves them before these rules.
[[redirects]]
  from   = "/admin"
  to     = "/ops-9f3a2c/index.html"
  status = 200

[[redirects]]
  from   = "/admin/*"
  to     = "/ops-9f3a2c/index.html"
  status = 200

[[redirects]]
  from   = "/ops-9f3a2c/*"
  to     = "/ops-9f3a2c/index.html"
  status = 200

# Missing Expo hashed assets must 404 — not SPA HTML. Otherwise browsers parse
# index.html as JS ("Unexpected token '<'") / Metro "unknown module". Existing
# files under dist/ are still served first; this only applies when the hash is gone.
# Clients then hit installWebDeployRecoveryListener → one-shot reload.
[[redirects]]
  from   = "/_expo/static/*"
  to     = "/index.html"
  status = 404

# SPA client routes only. Existing files under dist/ are served first.
# public/_headers keeps index.html uncached; see lib/webDeployRecovery.ts.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Content-hashed chunks — safe to cache forever.
# Netlify auto-serves .br / .gz sidecars (created by scripts/compress-dist.js)
# based on Accept-Encoding; no manual Content-Encoding header needed.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ops-9f3a2c/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ops-9f3a2c/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/oms/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/oms/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
